:spring:
  application:
    name: wallet-system
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  docker:
      compose:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway quản lý schema, JPA chỉ validate
    show-sql: false               # Tắt ở prod, bật lúc debug bằng logging level
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-please}
    access-token-expiration-ms: 900000       # 15 phút
    refresh-token-expiration-ms: 604800000   # 7 ngày

logging:
  pattern:
    # Thêm requestId (từ MDC) vào mọi log line
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [requestId=%X{requestId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.wallet: DEBUG
